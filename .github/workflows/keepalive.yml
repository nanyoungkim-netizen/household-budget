name: Supabase Keep-Alive

# 무료 Supabase 프로젝트는 7일간 호출이 없으면 일시정지(pause)된다.
# (데이터는 보존되지만 수동 복구가 필요) → 주기적으로 가벼운 요청을 보내
# 프로젝트가 잠들지 않게 유지한다. 공개 저장소라 GitHub Actions는 무료.
#
# 사용 키는 publishable(공개) 키 — 브라우저/앱에 이미 노출되는 공개값이라
# 저장소에 적어도 보안 문제 없음(데이터는 RLS로 보호됨).

on:
  schedule:
    - cron: '17 5 */2 * *'   # 이틀마다 05:17 UTC 실행 (7일 한참 이내)
  workflow_dispatch:          # 수동 실행 버튼도 제공

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://romxbwiclhieymdnxmyu.supabase.co/rest/v1/ledgers?select=row_id&limit=1" \
            -H "apikey: sb_publishable_lT6dbgLTL6YVvYusDnQZaQ_UkwDYS1A")
          echo "Supabase responded HTTP $code"
          # 2xx/4xx 모두 '프로젝트가 깨어있음'을 의미(요청이 도달함). 5xx/000만 실패로 처리.
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "Keep-alive ping failed"; exit 1
          fi
